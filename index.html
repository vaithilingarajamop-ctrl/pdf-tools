<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Register</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17302b;--mute:#5d7570;--line:#d5e0dc;--acc:#0f766e;--danger:#b42318;--hi:#e6f4f1}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a18;--card:#16241f;--ink:#e4efec;--mute:#93aba5;--line:#2a3d37;--acc:#3cc4b4;--danger:#f97066;--hi:#1d332d}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:20px 14px}
main{max-width:900px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 12px;color:var(--mute);font-size:.92rem}
#note{margin:0 0 12px;padding:8px 12px;border-radius:8px;background:var(--hi);font-size:.9rem}
#note.err{color:var(--danger)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;color-scheme:light dark}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#search{flex:1 1 180px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;padding:8px 14px}
button.ghost{background:transparent;color:var(--danger);border-color:transparent;padding:6px 10px}
button.ghost:hover{background:var(--hi)}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{padding:10px;font-size:.85rem;color:var(--mute);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th.n{cursor:default}
td.idx{color:var(--mute);width:36px;padding-left:12px}
td input,td select{width:100%;border-color:transparent;background:transparent;box-sizing:border-box}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{background:var(--hi)}
.empty{padding:24px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>Book register</h1>
<p class="sub">Yaar edit pannaalum ellarukkum live-a update aagum.</p>
<div id="note" hidden></div>
<div class="bar">
<input id="search" placeholder="Search name, book, status..." aria-label="Search rows">
<button id="add">Add row</button>
</div>
<div class="wrap">
<table>
<thead><tr>
<th class="n">#</th><th data-k="name">Name</th><th data-k="date">Date</th><th data-k="bookNo">Book no</th><th data-k="bookName">Book name</th><th data-k="status">Status</th><th class="n"></th>
</tr></thead>
<tbody id="body"></tbody>
</table>
<div id="empty" class="empty" hidden>Rows illa. "Add row" click pannu.</div>
</div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== STEP: Firebase console-la irundhu unga config-a inga paste pannu ===== */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
/* ========================================================================== */

const STATUS=["Pending","Completed"],FIELDS=["name","date","bookNo","bookName","status"];
const body=document.getElementById("body"),noteEl=document.getElementById("note");
const today=()=>new Date().toISOString().slice(0,10);
let data=[],sortK=null,sortDir=1,ready=false,col=null,db=null;
const rowEls=new Map(),q={};

function note(msg,err){noteEl.textContent=msg;noteEl.className=err?"err":"";noteEl.hidden=!msg}
function fail(){note("Save aagala. Internet check pannu, illa konjam neram kazhichu try pannu.",true)}

/* ---- debounced writes, one at a time per row ---- */
function queueWrite(id,f,v){
  const s=q[id]||(q[id]={patch:{},timer:null,busy:false});
  s.patch[f]=v;clearTimeout(s.timer);s.timer=setTimeout(()=>flush(id),400);
}
async function flush(id){
  const s=q[id];if(!s||!Object.keys(s.patch).length)return;
  if(s.busy){s.timer=setTimeout(()=>flush(id),300);return}
  const patch=s.patch;s.patch={};s.busy=true;
  try{await updateDoc(doc(db,"books",id),patch)}catch(e){fail()}
  s.busy=false;
  if(Object.keys(s.patch).length)flush(id);
}

/* ---- rendering ---- */
function apply(list){
  data=list.map(r=>{const p=q[r.id]&&q[r.id].patch;return p?{...r,...p}:r});
  render();
}
function makeRow(r){
  const tr=document.createElement("tr");
  tr.innerHTML=`<td class="idx"></td>
  <td><input data-f="name" maxlength="100" aria-label="Name"></td>
  <td><input data-f="date" type="date" aria-label="Date"></td>
  <td><input data-f="bookNo" maxlength="100" aria-label="Book no"></td>
  <td><input data-f="bookName" maxlength="100" aria-label="Book name"></td>
  <td><select data-f="status" aria-label="Status">${STATUS.map(s=>`<option>${s}</option>`).join("")}</select></td>
  <td><button class="ghost" aria-label="Delete row">Delete</button></td>`;
  tr.addEventListener("input",e=>{
    const f=e.target.dataset.f;if(!f)return;
    const row=data.find(x=>x.id===r.id);if(row)row[f]=e.target.value;
    queueWrite(r.id,f,e.target.value);
  });
  const btn=tr.querySelector("button");let armed=false;
  btn.onclick=async()=>{
    if(!armed){armed=true;btn.textContent="Sure?";setTimeout(()=>{armed=false;btn.textContent="Delete"},3000);return}
    delete q[r.id];
    try{await deleteDoc(doc(db,"books",r.id))}catch(e){fail()}
  };
  return tr;
}
function render(){
  const term=document.getElementById("search").value.toLowerCase();
  let list=data.filter(r=>[r.name,r.bookNo,r.bookName,r.status].some(v=>String(v||"").toLowerCase().includes(term)));
  if(sortK)list=[...list].sort((a,b)=>((a[sortK]||"")>(b[sortK]||"")?1:(a[sortK]||"")<(b[sortK]||"")?-1:0)*sortDir);
  const ids=new Set(data.map(r=>r.id));
  for(const[id,el]of rowEls)if(!ids.has(id)){el.remove();rowEls.delete(id)}
  const shown=new Set(list.map(r=>r.id));
  list.forEach((r,i)=>{
    let tr=rowEls.get(r.id);
    if(!tr){tr=makeRow(r);rowEls.set(r.id,tr)}
    tr.querySelector(".idx").textContent=i+1;
    FIELDS.forEach(f=>{
      const el=tr.querySelector(`[data-f=${f}]`),v=r[f]==null?"":r[f];
      if(el!==document.activeElement&&el.value!==v)el.value=v;
    });
    if(body.children[i]!==tr)body.insertBefore(tr,body.children[i]||null);
  });
  for(const[id,el]of rowEls)if(!shown.has(id)&&el.parentNode)el.remove();
  document.getElementById("empty").hidden=list.length>0;
}

document.getElementById("add").onclick=async()=>{
  if(!ready){note("Modhalla index.html-la firebaseConfig paste pannu.",true);return}
  document.getElementById("search").value="";
  try{await addDoc(col,{name:"",date:today(),bookNo:"",bookName:"",status:"Pending",createdAt:Date.now()})}catch(e){fail()}
};
document.getElementById("search").oninput=render;
document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;sortDir=sortK===k?-sortDir:1;sortK=k;render();
});

if(firebaseConfig.apiKey==="YOUR_API_KEY"){
  note("Setup pending: index.html-la firebaseConfig-a unga Firebase details-oda maathu.",true);
}else{
  db=getFirestore(initializeApp(firebaseConfig));
  col=collection(db,"books");
  ready=true;
  onSnapshot(query(col,orderBy("createdAt")),
    s=>{note("");apply(s.docs.map(d=>({id:d.id,...d.data()})))},
    ()=>note("Data load aagala. Firestore rules check pannu.",true));
}
render();
</script>
</body>
</html>
